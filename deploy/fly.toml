
# Fly.io app configuration
# Rename the app name below or override with `-a your-app-name` when deploying
app = "multiplayer-prototype"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DOTNET_ENVIRONMENT = "Fly"

# TCP service for health checks (maps 80/443 to internal 8080)
[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "requests"

# UDP game service; external and internal ports must match
[[services]]
  protocol = "udp"
  internal_port = 9050

  [[services.ports]]
    port = 9050
