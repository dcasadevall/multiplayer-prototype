# .github/workflows/deploy.yml
name: Deploy to Heroku

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Heroku Container Registry
      # Heroku expects username "_" and an API token/password.
      - name: Docker login (Heroku)
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      # Build & push image to Heroku's registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          file: ./deploy/Dockerfile
          push: true
          tags: registry.heroku.com/${{ vars.HEROKU_APP_NAME }}/web:latest

      # Install Heroku CLI to run `container:release`
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      # Release the new image
      - name: Release on Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          heroku auth:token >/dev/null 2>&1 || true
          heroku container:release web -a ${{ vars.HEROKU_APP_NAME }}
