# .github/workflows/deploy.yml
name: Deploy to Heroku

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HEROKU_APP: ${{ vars.HEROKU_APP_NAME }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker login (Heroku)
        uses: docker/login-action@v3
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_API_KEY }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          file: ./deploy/Dockerfile
          push: true
          tags: registry.heroku.com/${{ env.HEROKU_APP }}/web:latest

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install-ubuntu.sh | sh

      - name: Ensure Heroku stack is 'container'
        run: |
          heroku stack:set container -a "$HEROKU_APP"
          heroku stack -a "$HEROKU_APP"

      - name: Release image
        run: |
          heroku container:release web -a "$HEROKU_APP"
